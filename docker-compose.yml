services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-integrity}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-integrity_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-integrity_learning}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-integrity} -d ${POSTGRES_DB:-integrity_learning}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
    restart: unless-stopped
    environment:
      NODE_ENV: development
      PORT: 4000
      DATABASE_URL: postgresql://${POSTGRES_USER:-integrity}:${POSTGRES_PASSWORD:-integrity_dev_password}@postgres:5432/${POSTGRES_DB:-integrity_learning}?schema=public
      JWT_SECRET: ${JWT_SECRET:-development-only-secret-change-before-production-1234}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-7d}
      MAX_ACTIVE_SESSIONS: ${MAX_ACTIVE_SESSIONS:-5}
      COOKIE_NAME: ${COOKIE_NAME:-integrity_token}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      CLIENT_URL: ${CLIENT_URL:-http://localhost:3000}
    command: >
      sh -c "npx prisma migrate deploy &&
             npx prisma db seed &&
             node src/server.js"
    ports:
      - "${BACKEND_PORT:-4000}:4000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:4000/health"]
      interval: 10s
      timeout: 5s
      retries: 10

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    restart: unless-stopped
    environment:
      VITE_API_URL: ${VITE_API_URL:-http://localhost:4000/api}
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    depends_on:
      backend:
        condition: service_healthy

  pgadmin:
    image: dpage/pgadmin4:9
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL:-admin@example.gov}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD:-admin_dev_password}
    ports:
      - "${PGADMIN_PORT:-5050}:80"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - pgadmin_data:/var/lib/pgadmin

volumes:
  postgres_data:
  pgadmin_data:
